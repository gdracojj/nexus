<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:38px;font-weight:700}.sub{font-size:19px;fill:#64748b}.label{font-size:20px;font-weight:700;text-anchor:middle}.small{font-size:16px;text-anchor:middle;fill:#475569}.lane{font-size:17px;font-weight:700;fill:#64748b}.node{fill:#fff;stroke-width:2.5}.edge{fill:none;stroke:#475569;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#475569"/></marker></defs>
<text x="800" y="60" text-anchor="middle" class="title">Arquitetura do Nexus</text><text x="800" y="96" text-anchor="middle" class="sub">Coleta independente da API de leitura; dados persistidos no PostgreSQL</text>
<rect x="40" y="145" width="1520" height="400" rx="24" fill="#f8fafc" stroke="#e2e8f0"/><text x="70" y="180" class="lane">FLUXO DE COLETA E PERSISTÊNCIA</text>
<rect x="40" y="600" width="1520" height="330" rx="24" fill="#f8fafc" stroke="#e2e8f0"/><text x="70" y="635" class="lane">FLUXO DE CONSULTA E ANALYTICS</text>
<g><rect class="node" x="75" y="260" width="190" height="130" rx="18" stroke="#7c3aed" fill="#f5f0ff"/><text class="label" x="170" y="305">PNCP</text><text class="small" x="170" y="337">Fonte externa</text><text class="small" x="170" y="361">Contratações públicas</text>
<rect class="node" x="325" y="260" width="190" height="130" rx="18" stroke="#7c3aed" fill="#f5f0ff"/><text class="label" x="420" y="305">PNCP Client</text><text class="small" x="420" y="337">HTTP, paginação</text><text class="small" x="420" y="361">timeouts e retries</text>
<rect class="node" x="575" y="260" width="190" height="130" rx="18" stroke="#3b82f6" fill="#eff6ff"/><text class="label" x="670" y="305">Parser / ETL</text><text class="small" x="670" y="337">Extração e parsing</text><text class="small" x="670" y="361">normalização</text>
<rect class="node" x="825" y="260" width="190" height="130" rx="18" stroke="#3b82f6" fill="#eff6ff"/><text class="label" x="920" y="305">Validação</text><text class="small" x="920" y="337">Regras e qualidade</text><text class="small" x="920" y="361">dos registros</text>
<rect class="node" x="1075" y="260" width="190" height="130" rx="18" stroke="#14b8a6" fill="#f0fdfa"/><text class="label" x="1170" y="305">Services / Repository</text><text class="small" x="1170" y="337">Regras de negócio</text><text class="small" x="1170" y="361">e persistência</text>
<rect class="node" x="1325" y="260" width="190" height="130" rx="18" stroke="#2563eb" fill="#eff6ff"/><text class="label" x="1420" y="305">PostgreSQL</text><text class="small" x="1420" y="337">Banco relacional</text><text class="small" x="1420" y="361">registros persistidos</text></g>
<g class="edge"><path d="M265 325H325"/><path d="M515 325H575"/><path d="M765 325H825"/><path d="M1015 325H1075"/><path d="M1265 325H1325"/></g>
<rect class="node" x="325" y="430" width="300" height="85" rx="16" stroke="#14b8a6" fill="#f0fdfa"/><text class="label" x="475" y="465">CLI de coleta</text><text class="small" x="475" y="490">Inicia a execução do pipeline</text><path class="edge" d="M420 430V405H420V390"/>
<rect class="node" x="1080" y="700" width="200" height="115" rx="18" stroke="#7c3aed" fill="#f5f0ff"/><text class="label" x="1180" y="742">FastAPI</text><text class="small" x="1180" y="772">API REST</text><text class="small" x="1180" y="794">leitura dos dados</text>
<rect class="node" x="1350" y="700" width="180" height="115" rx="18" stroke="#14b8a6" fill="#f0fdfa"/><text class="label" x="1440" y="742">Frontend</text><text class="small" x="1440" y="772">Nexus</text><text class="small" x="1440" y="794">painel analítico</text>
<rect class="node" x="720" y="700" width="260" height="115" rx="18" stroke="#3b82f6" fill="#eff6ff"/><text class="label" x="850" y="742">SQL / Analytics</text><text class="small" x="850" y="772">Consultas e exploração</text><text class="small" x="850" y="794">analítica dos dados</text>
<g class="edge"><path d="M1420 390V565H1180V700"/><path d="M1280 757H1350"/><path d="M1325 390V650H850V700"/></g><text x="1290" y="548" class="small">Leitura via API</text><text x="1120" y="638" class="small">Consultas à base</text><text x="800" y="880" class="sub" text-anchor="middle">A coleta grava no banco; a API e as consultas analíticas leem os dados já persistidos.</text></svg>