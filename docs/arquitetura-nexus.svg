 text{font-family:Inter,Arial,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#64748b}.node{fill:#fff;stroke-width:2.5}.label{font-size:19px;font-weight:600;text-anchor:middle}.small{font-size:16px;font-weight:500;text-anchor:middle}.arrow{fill:none;stroke:#64748b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
