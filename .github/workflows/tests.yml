name: Testes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Python ${{ matrix.python-version }} + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NEXUS_TEST_DATABASE_URL: postgresql+psycopg2://nexus:nexus@localhost:5432/nexus_test

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-test.txt

      - name: Conferir dependências instaladas
        run: python -m pip check

      - name: Executar testes backend e integração PostgreSQL
        run: python -m pytest -q

      - name: Validar sintaxe JavaScript
        run: |
          node --check --input-type=module < frontend/app.js
          node --check --input-type=module < frontend/api.js
          node --check --input-type=module < frontend/prazo.js
          node --check frontend/theme.js
